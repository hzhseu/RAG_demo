[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nord-rag"
version = "0.1.0"
description = "Offline Windows PPTX knowledge library"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi", "uvicorn", "numpy", "python-pptx", "pillow", "httpx", "pypdf"]

[project.scripts]
kb-builder = "nordrag.cli:main"
nord-chat = "nordrag.launcher:main"

[tool.setuptools.packages.find]
include = ["nordrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
